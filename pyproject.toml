[project]
name = "inbox-triage-agent"
version = "0.1.0"
description = "Guardrailed LLM agent that triages a Gmail inbox and drafts replies for human review."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
